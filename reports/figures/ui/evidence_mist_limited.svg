
    <svg width="100%" height="42" viewBox="0 0 320 42" xmlns="http://www.w3.org/2000/svg" aria-label="Evidence meter: Limited Evidence (Uncertain)">
        <defs>
            <linearGradient id="mistGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#B3A5FF" stop-opacity="0.1" />
                <stop offset="50%" stop-color="#B3A5FF" stop-opacity="0.65" />
                <stop offset="100%" stop-color="#B3A5FF" stop-opacity="0.1" />
            </linearGradient>
            <filter id="mistBlur" x="-10%" y="-30%" width="120%" height="160%">
                <feGaussianBlur stdDeviation="3" />
            </filter>
        </defs>
        <!-- Background track -->
        <rect x="10" y="8" width="300" height="12" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
        <!-- Soft mist band representing uncertainty span -->
        <rect x="20" y="7" width="70" height="14" rx="7" fill="url(#mistGrad)" filter="url(#mistBlur)" />
        <rect x="20" y="9" width="70" height="10" rx="5" fill="#B3A5FF" opacity="0.45" />
        <!-- Text label -->
        <text x="12" y="34" font-family="-apple-system, sans-serif" font-size="11" fill="#B3A5FF" font-weight="600">Limited Evidence (Uncertain)</text>
    </svg>
    